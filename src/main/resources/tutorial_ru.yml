title: 'Жилы'
pages:
  - title: 'Поиск руды'
    text: |
      Держите осколок аметиста, присядьте и нажмите ПКМ: лоза покажет ближайшие руды и след из частиц.
  - title: 'Добыча целых жил'
    text: |
      Присядьте и добудьте руду подходящей киркой — вся жила добудется сразу. Удача и износ работают как обычно.
  - title: 'Карта и журнал'
    text: |
      /veinmap показывает руду в соседних чанках. /veinjournal отмечает найденные виды.
