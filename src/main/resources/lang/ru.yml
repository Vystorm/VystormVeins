commands:
  veinjournal:
    aliases: []
    usage: ""
    name: veinjournal
    description: "Показать находки и цели коллекции"
  vveins:
    description: 'Ручные вены: статус, перезагрузка, предварительный просмотр и применение текущего чанка'
    aliases: []
    sub:
      status:
        name: status
        aliases: []
        description: Миры, правила, сгенерированные чанки, рост, поиск, добыча вен и карта руды
      reload:
        name: reload
        aliases: []
        description: Проверьте и перезагрузите config.yml (недействительный файл сохраняет старые настройки)
      preview:
        name: preview
        aliases: []
        description: Предварительный просмотр регенерации руд вашего чанка (действует в течение 30 секунд)
      apply:
        name: apply
        aliases: []
        description: Примените предварительный просмотр вашего чанка - сначала поддержите мир
      cancel:
        name: cancel
        aliases: []
        description: Откажитесь от предварительного просмотра без изменения блоков
  veinmap:
    description: Оре карта чанков вокруг вас
    aliases: []
  veinclaim:
    description: "Показать или снять заявку на жилу"
    aliases: []
    sub:
      release:
        name: "release"
        aliases: []
        description: "Снять заявку"
  veinmine:
    description: Переключите свои предпочтения в майнинге вен (спасенные между сеансами)
    aliases: []
