# 通过 Vystorm Core 0.64.0+ 提供的 /vveins 和 /veinmap：每位玩家看到自己语言的说明、帮助和 Tab 补全。commands.<命令> 下的
# "aliases" 是额外的主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name" 和
# "aliases" 在所有语言中都可使用，英文始终有效。
veinmine-enabled: "<green>已为你启用连锁采矿。潜行和工具要求仍遵循服务器设置。"
veinmine-disabled: "<gray>已为你禁用连锁采矿。现在只会开采单个方块。"
veinmine-server-off: "<gray>此服务器目前已关闭连锁采矿；你的偏好已保存。"
veinmine-usage: "<gray>/veinmine"

commands:
  veinjournal:
    aliases: [采矿日志]
    usage: ""
    name: 采矿日志
    description: "查看个人采矿发现和收藏目标"
  vveins:
    description: "矿脉：状态、重载、预览并应用当前区块"
    aliases: [矿脉]
    sub:
      status:
        name: 状态
        aliases: []
        description: "世界、规则、已生成区块、再生、探矿、连锁采矿和矿石地图"
      reload:
        name: 重载
        aliases: []
        description: "检查并重新加载 config.yml（文件无效时保留旧设置）"
      preview:
        name: 预览
        aliases: []
        description: "预览重新生成你所在区块的矿石（30 秒内有效）"
      apply:
        name: 应用
        aliases: []
        description: "应用你所在区块的预览——请先备份世界"
      cancel:
        name: 取消
        aliases: []
        description: "放弃预览，不改变任何方块"
  veinmap:
    description: "你周围区块的矿石地图"
    aliases: [矿石地图]
  veinclaim:
    description: "查看或释放你的采矿占有"
    aliases: []
    sub:
      release:
        name: "释放"
        aliases: []
        description: "释放占有"
  veinmine:
    description: "切换你的连锁采矿偏好（退出后保留）"
    aliases: [连锁采矿]

