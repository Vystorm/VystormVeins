commands:
  veinjournal:
    aliases: []
    usage: ""
    name: veinjournal
    description: "Lire les découvertes minières et les objectifs de collection"
  vveins:
    description: 'Les veines d''or : état, recharger, prévisualiser et appliquer le morceau courant'
    aliases: []
    sub:
      status:
        name: status
        aliases: []
        description: Mondes, règles, morceaux générés, repousse, prospection, mines de veines et carte du minerai
      reload:
        name: reload
        aliases: []
        description: Vérifier et recharger config.yml (un fichier invalide conserve les anciens paramètres)
      preview:
        name: preview
        aliases: []
        description: Aperçu régénérant les minerais de votre morceau (valable pour 30 secondes)
      apply:
        name: apply
        aliases: []
        description: Appliquez l'aperçu de votre morceau – sauvegardez le monde d'abord
      cancel:
        name: cancel
        aliases: []
        description: Jetez votre aperçu sans changer de bloc
  veinmap:
    description: Carte des morceaux autour de vous
    aliases: []
  veinclaim:
    description: "Voir ou libérer ta revendication"
    aliases: []
    sub:
      release:
        name: "release"
        aliases: []
        description: "Libérer ta revendication"
  veinmine:
    description: Basculez votre préférence pour l'extraction de veines (entre les sessions)
    aliases: []
