# /vveins und /veinmap über Vystorm Core 0.64.0+: Beschreibung, Hilfe und Tab-Vervollständigung je Spieler. "aliases"
# unter commands.<befehl> sind zusätzliche Hauptbefehle (serverweit, der Admin wählt die Sprachen: Core-Konfig
# commands.localized-aliases); "name" und "aliases" eines Unterbefehls werden in jeder Sprache verstanden, Englisch geht immer.
veinmine-enabled: "<green>Aderabbau für dich eingeschaltet. Schleich- und Werkzeugvorgaben des Servers gelten weiterhin."
veinmine-disabled: "<gray>Aderabbau für dich ausgeschaltet. Du baust jetzt einzelne Blöcke ab."
veinmine-server-off: "<gray>Der Aderabbau ist auf diesem Server derzeit ausgeschaltet; deine Einstellung wurde gespeichert."
veinmine-usage: "<gray>/veinmine"

commands:
  veinjournal:
    aliases: [bergbaujournal]
    usage: ""
    name: bergbaujournal
    description: "Persönliche Erzfundstatistik und Sammelziele lesen"
  vveins:
    description: "Erzadern: Status, neu laden, Vorschau und Anwenden im aktuellen Chunk"
    aliases: [erzadern]
    sub:
      status:
        name: status
        aliases: [zustand]
        description: "Welten, Regeln, erzeugte Chunks, Nachwachsen, Erzsuche, Aderabbau und Erzkarte"
      reload:
        name: neuladen
        aliases: []
        description: "config.yml prüfen und neu laden (eine ungültige Datei lässt die alten Einstellungen aktiv)"
      preview:
        name: vorschau
        aliases: []
        description: "Vorschau: Erze deines Chunks neu erzeugen (30 Sekunden gültig)"
      apply:
        name: anwenden
        aliases: []
        description: "Die Vorschau deines Chunks anwenden – vorher die Welt sichern"
      cancel:
        name: verwerfen
        aliases: [abbrechen]
        description: "Deine Vorschau verwerfen, ohne Blöcke zu ändern"
  veinmap:
    description: "Erzkarte der Chunks um dich herum"
    aliases: []
  veinclaim:
    description: "Dein Schürfrecht anzeigen oder freigeben"
    aliases: []
    sub:
      release:
        name: "freigeben"
        aliases: []
        description: "Schürfrecht freigeben"
  veinmine:
    description: "Deinen Aderabbau umschalten (bleibt nach dem Ausloggen gespeichert)"
    aliases: [aderabbau]

