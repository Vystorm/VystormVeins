# /vveins and /veinmap through Vystorm Core 0.64.0+: description, help and tab completion per player. "aliases" under
# commands.<command> are extra root commands (server-wide, the admin chooses which languages: Core config
# commands.localized-aliases); "name" and "aliases" of a subcommand are accepted in every language, English always works.
veinmine-enabled: "<green>Vein mining enabled for you. Sneaking and tool requirements still follow the server settings."
veinmine-disabled: "<gray>Vein mining disabled for you. You now mine individual blocks."
veinmine-server-off: "<gray>Vein mining is currently switched off on this server; your preference has been saved."
veinmine-usage: "<gray>/veinmine"

commands:
  veinjournal:
    aliases: []
    usage: ""
    name: veinjournal
    description: "Read personal mining discoveries and collection goals"
  vveins:
    description: "Ore veins: status, reload, preview and apply the current chunk"
    aliases: []
    sub:
      status:
        name: status
        aliases: []
        description: "Worlds, rules, generated chunks, regrowth, prospecting, vein mining and ore map"
      reload:
        name: reload
        aliases: []
        description: "Check and reload config.yml (an invalid file keeps the old settings)"
      preview:
        name: preview
        aliases: []
        description: "Preview regenerating the ores of your chunk (valid for 30 seconds)"
      apply:
        name: apply
        aliases: []
        description: "Apply the preview of your chunk – back up the world first"
      cancel:
        name: cancel
        aliases: []
        description: "Discard your preview without changing blocks"
  veinmap:
    description: "Ore map of the chunks around you"
    aliases: []
  veinclaim:
    description: "Show or release your mining claim"
    aliases: []
    sub:
      release:
        name: "release"
        aliases: []
        description: "Release your claim"
  veinmine:
    description: "Toggle your vein mining preference (saved between sessions)"
    aliases: []

