commands:
  veinjournal:
    aliases: []
    usage: ""
    name: veinjournal
    description: "Ver descobertas de mineração e metas de coleção"
  vveins:
    description: 'Ore veias: status, recarga, visualização e aplicar o pedaço atual'
    aliases: []
    sub:
      status:
        name: status
        aliases: []
        description: Mundos, regras, pedaços gerados, crescimento, prospecção, mineração de veias e mapa de minério
      reload:
        name: reload
        aliases: []
        description: Verifique e recarregue config.yml (um arquivo inválido mantém as configurações antigas)
      preview:
        name: preview
        aliases: []
        description: Visualização regenerando os minérios do seu pedaço (válido por 30 segundos)
      apply:
        name: apply
        aliases: []
        description: Aplique a pré-visualização do seu pedaço - de volta ao mundo primeiro
      cancel:
        name: cancel
        aliases: []
        description: Descarte sua prévia sem mudar de bloco
  veinmap:
    description: Ore mapa dos pedaços ao seu redor
    aliases: []
  veinclaim:
    description: "Ver ou liberar sua reivindicação"
    aliases: []
    sub:
      release:
        name: "release"
        aliases: []
        description: "Liberar a reivindicação"
  veinmine:
    description: Alterne sua preferência de mineração de veias
    aliases: []
