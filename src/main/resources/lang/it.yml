commands:
  veinjournal:
    aliases: []
    usage: ""
    name: veinjournal
    description: "Leggi le scoperte minerarie e gli obiettivi di collezione"
  vveins:
    description: 'Vene di ore: stato, ricarica, anteprima e applicare il chunk corrente'
    aliases: []
    sub:
      status:
        name: status
        aliases: []
        description: Mondi, regole, blocchi generati, ricrescita, prospezione, estrazione mineraria di vena e mappa dei minerali
      reload:
        name: reload
        aliases: []
        description: Controllare e ricaricare config.yml (un file non valido mantiene le vecchie impostazioni)
      preview:
        name: preview
        aliases: []
        description: Anteprima rigenerazione dei minerali del vostro pezzo (valida per 30 secondi)
      apply:
        name: apply
        aliases: []
        description: Applicare l'anteprima del tuo pezzo – back up il mondo prima
      cancel:
        name: cancel
        aliases: []
        description: Eliminare l'anteprima senza cambiare blocchi
  veinmap:
    description: Ore mappa dei pezzi intorno a te
    aliases: []
  veinclaim:
    description: "Mostra o libera la tua rivendicazione"
    aliases: []
    sub:
      release:
        name: "release"
        aliases: []
        description: "Libera la rivendicazione"
  veinmine:
    description: Toggle la vostra preferenza di estrazione mineraria di vena (salvato tra sessioni)
    aliases: []
