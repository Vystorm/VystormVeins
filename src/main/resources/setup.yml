    "en": "Veins adds large ore deposits, a prospecting rod and vein mining. Ore changes only affect newly generated chunks.",
    "de": "Veins bringt große Erzadern, eine Wünschelrute und Aderabbau. Erzänderungen wirken nur in neu erzeugten Chunks.",
    "fr": "Veins ajoute de grands gisements, une baguette de prospection et le minage de filons. Les minerais ne changent que dans les nouveaux chunks.",
    "it": "Veins aggiunge grandi giacimenti, una bacchetta da prospezione e l’estrazione di vene. I minerali cambiano solo nei nuovi chunk.",
    "pt_br": "Veins adiciona grandes jazidas, uma varinha de prospecção e mineração de veios. Minérios mudam só em chunks novos.",
    "ru": "Veins добавляет большие залежи, лозу и добычу жил. Руды меняются только в новых чанках.",
    "zh_cn": "Veins 添加大型矿脉、探矿杖和连锁采矿。矿石更改仅影响新生成的区块。"
  },
